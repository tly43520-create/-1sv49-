<text x="390" y="522" font-size="12" text-anchor="middle" fill="#3C3489">磷 1×10¹⁹ cm⁻³，y = 8 – 10</text>
<text x="390" y="570" font-size="12.5" text-anchor="middle" fill="#2C2C2A">阴极 Cathode（底边全宽）</text>
