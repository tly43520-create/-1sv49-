</defs>
<rect width="1100" height="780" fill="#ffffff"/>
<text x="40" y="34" font-size="20" font-weight="700" fill="#2C2C2A">iter00-2D 超突变变容管二维结构参数（练习版）</text>
<text x="40" y="54" font-size="12.5" fill="#5F5E5A">纵向掺杂与 iter00 完全相同，仅改几何（加入钝化层窗口与 P⁺ 横向边缘）；y 向下为正，单位 µm；纵向非等比例</text>
