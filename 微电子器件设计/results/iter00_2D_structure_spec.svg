<text x="190" y="246" font-size="10.5" text-anchor="middle" fill="#A32D2D">x 4–6, y 0–1</text>
<text x="590" y="246" font-size="10.5" text-anchor="middle" fill="#A32D2D">x 24–26, y 0–1</text>
