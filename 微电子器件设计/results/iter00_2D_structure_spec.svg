</g>
<text x="40" y="608" font-size="11.5" fill="#5F5E5A">深度 y (µm)：0.31 = 冶金结（由净掺杂自动形成）；≈0.8 = 超突变尾部；底部数字为 x 坐标 (µm)</text>
<g font-size="12">
<rect x="720" y="70" width="350" height="54" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="734" y="91" font-size="13.5" font-weight="700" fill="#0C447C">SiO₂ 钝化层（Oxide）</text>
<text x="734" y="112" fill="#185FA5">x = 0–5 与 25–30，y = −0.5 – 0</text>
<rect x="720" y="132" width="350" height="54" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="734" y="153" font-size="13.5" font-weight="700" fill="#444441">阳极 Anode</text>
<text x="734" y="174" fill="#5F5E5A">硅顶面 x = 5–25 段（GUI 选边，Journal 录制）</text>
<rect x="720" y="194" width="350" height="72" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="734" y="215" font-size="13.5" font-weight="700" fill="#712B13">P⁺ 阳极区：BoronActiveConcentration</text>
<text x="734" y="236" fill="#993C1D">基准线 x = 5–25 @ y = 0；PeakVal 1e20 @ 0</text>
<text x="734" y="256" fill="#993C1D">ValueAtDepth 1e17 @ Depth 0.297；Gauss Factor 0.8</text>
<rect x="720" y="274" width="350" height="72" rx="6" fill="#FBEAF0" stroke="#993556" stroke-width="0.8"/>
<text x="734" y="295" font-size="13.5" font-weight="700" fill="#72243E">N 超突变层：PhosphorusActiveConcentration</text>
<text x="734" y="316" fill="#993556">基准线 x = 0–30 @ y = 0（全宽）</text>
<text x="734" y="336" fill="#993556">PeakVal 6e16 @ PeakPos 0.40；StdDev 0.15</text>
<rect x="720" y="354" width="350" height="54" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="734" y="375" font-size="13.5" font-weight="700" fill="#444441">N⁻ 外延：磷均匀 3e14</text>
<text x="734" y="396" fill="#5F5E5A">区域 y = 0 – 8，x = 0 – 30</text>
<rect x="720" y="416" width="350" height="54" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="734" y="437" font-size="13.5" font-weight="700" fill="#26215C">N⁺ 衬底：磷均匀 1e19</text>
<text x="734" y="458" fill="#3C3489">区域 y = 8 – 10（截断）；阴极 = 底边全宽</text>
<rect x="720" y="478" width="350" height="72" rx="6" fill="#ffffff" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="734" y="499" font-size="13.5" font-weight="700" fill="#2C2C2A">材料与网格</text>
<text x="734" y="520" fill="#444441">Si（εr = 11.7），T = 300 K；拐角 x、y 最小 ≈0.01</text>
<text x="734" y="540" fill="#444441">窗口中央 x 步长 0.5–1；y 沿用 iter00 + 掺杂梯度细化</text>
</g>
<rect x="40" y="622" width="1030" height="140" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.8"/>
<text x="56" y="646" font-size="14" font-weight="700" fill="#633806">本版观察重点</text>
<g font-size="12.5" fill="#633806">
<text x="56" y="670">① 超突变层全宽：P⁺ 边缘向氧化层下方横向耗尽，等效结面积随偏压增大 → 预期容量比低于 iter00 的 17.4（可对比“仅窗口内注入”方案）。</text>
<text x="56" y="692">② P⁺ 拐角为柱面结，电场集中：在 15 V 下检查拐角峰值电场是否显著高于窗口中央（击穿风险点，一维看不到）。</text>
<text x="56" y="714">③ 二维结果含边缘电容，不能直接按面积换算：窗口 20 µm 与 40 µm 各跑一次，差值 = 纯面积项，从而分离单位面积与单位周长电容。</text>
<text x="56" y="736">注：P⁺ 圆角由高斯横向衰减（Factor 0.8）形成，属掺杂而非几何，无需倒角；图中圆角及各层厚度仅示意。</text>
</g>
</svg>
