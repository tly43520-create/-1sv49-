<line x1="74" y1="112" x2="82" y2="112"/><line x1="74" y1="130" x2="82" y2="130"/><line x1="74" y1="165" x2="82" y2="165"/><line x1="74" y1="205" x2="82" y2="205"/><line x1="74" y1="470" x2="82" y2="470"/><line x1="74" y1="540" x2="82" y2="540"/>
